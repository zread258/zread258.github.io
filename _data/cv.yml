        highlights:
          - "GPA: 3.84 / 4.00"

    Research Experience:
      - company: Shanghai Artificial Intelligence Laboratory
        position: Research Intern
        location: Shanghai, China
        start_date: 2026-01
        end_date: 2026-07
        highlights:
          - Designed and implemented an MLIR-based domain-specific compiler for GPU-intensive graphics workloads, preserving high-level application semantics through optimization and CUDA lowering.
          - Developed semantics-guided compiler optimizations that coordinate program rewriting, computation placement, and GPU memory decisions across the compilation pipeline.
          - Evaluated the compiler across representative workloads and multiple GPU architectures against hand-written CUDA and existing high-level programming systems, demonstrating substantial performance gains while improving programmability.

    Industry Experience:
      - company: Ubiquant Technology Co.
        position: Quantitative Implementation Intern
        location: Shanghai, China
        start_date: 2026-08
        end_date: 2026-09
        highlights:
          - Evaluated multi-node, multi-GPU LLM serving with SGLang and vLLM under prefill–decode disaggregation, characterizing TTFT/TPOT trade-offs across distributed execution configurations.
          - Investigated Mooncake-based KV-cache transfer and profiled compute, memory, and communication bottlenecks across prefill/decode placement strategies.

      - company: Houmo Technology Co.
        position: AI Compiler Development Intern
        location: Nanjing, China
        start_date: 2025-04
        end_date: 2025-07
        highlights:
          - Implemented 44 ONNX operators end-to-end for a RISC-V-based compute-in-memory NPU, spanning MLIR dialect definitions, pattern rewriting, and lowering to accelerator-specific primitives.
          - Built MLIR lowering and validation pipelines that mapped ONNX operators to backend execution constraints and regression-tested outputs against ONNX Runtime.

    Projects:
      - name: Compiler-Assisted Execution for Extensible Block-Diagram Simulation
        start_date: 2026-06
        end_date: present
        highlights:
          - Designed a compiler-assisted execution framework that lowers dynamically dispatched block-diagram models into compiled execution regions while preserving solver and state-update semantics.
          - Developed dependency-aware specialization to avoid redundant model evaluation during multi-stage ODE integration, compiling only computations affected by intermediate solver states.
          - Built a JIT execution path with cached native code and runtime fallback, supporting incremental compilation of eligible operator regions without replacing the existing simulation runtime.

      - name: RISC-V Processor Design & Architectural Validation
        start_date: 2024-04
        end_date: 2025-10
        summary: Designed a five-stage RV32E/RV32I processor and deployed it on an Artix-7 FPGA to boot RT-Thread.
        highlights:
          - Added forwarding and hazard control, branch handling, CSR/exception/interrupt support, and an AXI4 memory subsystem.
          - Built an RV32IM emulator with breakpoints, disassembly, and device simulation, together with Spike differential testing for ISA-level validation.

    Technical Skills:
